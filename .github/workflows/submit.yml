name: submit-clips
# Each run starts ~12 min before a slot and checks Vista every 30s for 32 min,
# so clips get submitted within ~1-3 min of going live even if GitHub starts late. Times are UTC (Pacific+8).
on:
  schedule:
    - cron: '18 22 20 11 *'   # Fri 2:30pm K
    - cron: '18 23 20 11 *'   # Fri 3:30pm B, 3:45pm K
    - cron: '48 0 21 11 *'    # Fri 5:00pm K+B
    - cron: '3 2 21 11 *'     # Fri 6:15pm K, 6:30pm B
    - cron: '18 3 21 11 *'    # Fri 7:30pm K
    - cron: '48 3 21 11 *'    # Fri 8:00pm B
    - cron: '33 4 21 11 *'    # Fri 8:45pm K
    - cron: '18 5 21 11 *'    # Fri 9:30pm B, 10:00pm K
    - cron: '48 16 21 11 *'   # Sat 9:00am B
    - cron: '48 18 21 11 *'   # Sat 11:00am B
    - cron: '48 20 21 11 *'   # Sat 1:00pm B
    - cron: '48 23 21 11 *'   # Sat 4:00pm B
    - cron: '48 2 22 11 *'    # Sat 7:00pm B
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: submit, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npx playwright install --with-deps chromium
      - run: node bot.js
        env: { STATE_JSON: '${{ secrets.STATE_JSON }}', LOOP_MIN: '32' }
      - if: always()
        run: cat report.txt >> $GITHUB_STEP_SUMMARY || true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git pull -q || true; git add -f submitted.log && git commit -m "log submissions" && git push || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: '*.png', if-no-files-found: ignore }
