name: submit-clips
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: submit, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npx playwright install --with-deps chromium
      - run: node bot.js
        env: { STATE_JSON: '${{ secrets.STATE_JSON }}' }
      - if: always()
        run: cat report.txt >> $GITHUB_STEP_SUMMARY || true
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f submitted.log 2>/dev/null && git commit -m "log submissions" && git push || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: '*.png', if-no-files-found: ignore }
