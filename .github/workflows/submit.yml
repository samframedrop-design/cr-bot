name: submit-clips
# Always-on: each run watches Vista every 30s for ~5h40m and submits every post that goes live,
# then starts the next run itself. The hourly cron is a backup that keeps one run queued at all times.
on:
  schedule: [{ cron: '7 * * * *' }]
  workflow_dispatch: {}
permissions: { contents: write, actions: write }
concurrency: { group: submit, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npx playwright install --with-deps chromium
      - run: git config user.name bot && git config user.email bot@users.noreply.github.com
      - run: node bot.js
        env: { STATE_JSON: '${{ secrets.STATE_JSON }}', LOOP_MIN: '340' }
      - if: always()
        run: test -f idle || gh workflow run submit.yml --ref main || true
        env: { GH_TOKEN: '${{ github.token }}' }
      - if: always()
        run: cat report.txt >> $GITHUB_STEP_SUMMARY || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: '*.png', if-no-files-found: ignore }
